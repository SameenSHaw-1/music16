<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 音乐16人格测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
    --text: #e8e8f0;
    --text-muted: rgba(232,232,240,0.55);
    --accent: #a855f7;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
  }

  /* ── Canvas for confetti ── */
  #confetti-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    display: none;
  }

  /* ── Pages ── */
  .page {
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .page.active { display: flex; }
  .page.visible { opacity: 1; }

  /* ── Stars bg ── */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(168,85,247,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(99,102,241,.12) 0%, transparent 50%);
  }

  /* ── Landing ── */
  #page-landing { position: relative; text-align: center; gap: 32px; }

  .landing-emoji {
    font-size: 80px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(168,85,247,.6));
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .landing-title {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, #c084fc 50%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .landing-sub {
    font-size: clamp(14px, 3.5vw, 18px);
    color: var(--text-muted);
    max-width: 360px;
    line-height: 1.7;
  }

  .btn-start {
    padding: 16px 48px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(168,85,247,.45);
    transition: transform .2s, box-shadow .2s;
  }
  .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(168,85,247,.6); }

  .landing-note {
    font-size: 13px;
    color: var(--text-muted);
    opacity: .7;
  }

  /* ── Quiz ── */
  #page-quiz { gap: 0; padding: 0; }

  .quiz-inner {
    width: 100%; max-width: 680px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 16px 24px;
    gap: 24px;
  }

  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
  }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,.12);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #a855f7, #6366f1);
    border-radius: 4px;
    transition: width .4s ease;
  }

  .question-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 32px 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    gap: 28px;
    transition: opacity .25s, transform .25s;
  }

  .question-card.fade-out { opacity: 0; transform: translateX(-20px); }
  .question-card.fade-in { opacity: 0; transform: translateX(20px); }

  .question-num {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .question-text {
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
  }

  .likert-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .likert-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-radius: 50px;
    border: 1.5px solid var(--card-border);
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .2s, background .2s, box-shadow .2s, transform .15s;
    text-align: left;
  }

  .likert-btn:hover {
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.25);
    transform: translateX(4px);
  }

  .likert-btn.selected {
    border-color: var(--accent);
    background: rgba(168,85,247,.18);
    box-shadow: 0 0 20px rgba(168,85,247,.25);
  }

  .likert-emoji { font-size: 18px; flex-shrink: 0; }
  .likert-label { flex: 1; }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .btn-nav {
    padding: 12px 28px;
    border-radius: 50px;
    border: 1.5px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .btn-nav:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }
  .btn-nav:disabled { opacity: .3; cursor: not-allowed; }

  .btn-next {
    padding: 12px 32px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 0 20px rgba(168,85,247,.3);
  }
  .btn-next:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(168,85,247,.45); }

  /* ── Result ── */
  #page-result { gap: 0; padding: 0; align-items: stretch; }

  .result-inner {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .result-hero {
    text-align: center;
    padding: 48px 24px 40px;
    border-radius: 28px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }

  .result-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--personality-color, #a855f7) 0%, transparent 65%);
    opacity: .18;
    pointer-events: none;
  }

  .result-emoji { font-size: 72px; margin-bottom: 16px; display: block; }

  .result-name {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, var(--personality-color, #a855f7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .result-tagline {
    font-size: 14px;
    color: var(--personality-color, #a855f7);
    font-weight: 500;
    letter-spacing: .05em;
    margin-bottom: 20px;
  }

  .result-desc {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.8;
    max-width: 520px;
    margin: 0 auto;
  }

  /* Dimension bars */
  .dims {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .dim-bar-wrap {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
  }

  .dim-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .dim-bar-bg {
    height: 6px;
    background: rgba(255,255,255,.1);
    border-radius: 6px;
    overflow: hidden;
  }

  .dim-bar-fill {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--personality-color, #a855f7), #818cf8);
    transition: width .8s ease .3s;
  }

  /* Artists grid */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .artists-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }

  .artist-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(10px);
    transition: transform .2s, border-color .2s;
  }
  .artist-card:hover { transform: translateY(-3px); border-color: var(--personality-color, #a855f7); }

  .artist-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .artist-songs {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .artist-song {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Secondary matches */
  .secondary-matches {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .secondary-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 50px;
    border: 1.5px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    font-size: 13px;
    cursor: default;
    transition: border-color .2s;
  }
  .secondary-chip:hover { border-color: rgba(255,255,255,.3); }

  .chip-emoji { font-size: 16px; }
  .chip-name { font-weight: 600; }
  .chip-tag { color: var(--text-muted); font-size: 11px; }

  /* Action buttons */
  .result-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-share {
    flex: 1; min-width: 140px; max-width: 220px;
    padding: 14px 24px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, var(--personality-color, #a855f7), #6366f1);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(168,85,247,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-share:hover { transform: scale(1.04); box-shadow: 0 0 35px rgba(168,85,247,.45); }

  .btn-restart {
    flex: 1; min-width: 140px; max-width: 220px;
    padding: 14px 24px;
    border-radius: 50px;
    border: 1.5px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .btn-restart:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }

  .copy-toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(30,30,50,.95);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    transition: transform .3s ease;
    z-index: 1000;
    white-space: nowrap;
  }
  .copy-toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .dims { grid-template-columns: 1fr; }
    .artists-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<canvas id="confetti-canvas"></canvas>
<div id="toast" class="copy-toast">✅ 已复制到剪贴板！</div>

<!-- LANDING -->

  <p class="landing-note">约需3分钟 · 共20道题</p>

<!-- QUIZ -->
<div id="page-quiz" class="page">

    <div class="progress-wrap">
      <div class="progress-label">

    </div>

    <div class="question-card" id="question-card">
      <div class="question-num" id="q-num">Q1</div>
      <div class="question-text" id="q-text"></div>
      <div class="likert-wrap" id="likert-wrap"></div>
    </div>

    <div class="quiz-nav">
      <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">← 上一题</button>
      <button class="btn-next" id="btn-next" onclick="navigate(1)">下一题 →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="page-result" class="page">
  <div class="result-inner" id="result-inner"></div>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────────

let currentPage = 'landing';
let currentQ = 0;
let answers = new Array(20).fill(null);
let autoAdvanceTimer = null;

// ─── PAGE TRANSITIONS ────────────────────────────────────────────────────────

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active', 'visible');
  });
  const page = document.getElementById('page-' + id);
  page.classList.add('active');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => page.classList.add('visible'));
  });
  currentPage = id;
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────

function startQuiz() {
  currentQ = 0;
  answers = new Array(20).fill(null);
  renderQuestion();
  showPage('quiz');
}

function renderQuestion(direction = 0) {
  const card = document.getElementById('question-card');
  const q = QUESTIONS[currentQ];

  // Fade out
  if (direction !== 0) {
    card.classList.add(direction > 0 ? 'fade-out' : 'fade-in');
  }

  const doRender = () => {
    // Progress
    document.getElementById('q-label').textContent = `第 ${currentQ + 1} 题`;
    document.getElementById('q-num').textContent = `Q${currentQ + 1}`;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('progress-fill').style.width = `${((currentQ + 1) / 20) * 100}%`;

    // Likert buttons
    const wrap = document.getElementById('likert-wrap');
    wrap.innerHTML = '';
    LIKERT.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'likert-btn' + (answers[currentQ] === idx ? ' selected' : '');
      btn.innerHTML = `<span class="likert-emoji">${opt.emoji}</span><span class="likert-label">${opt.label}</span>`;
      btn.onclick = () => selectAnswer(idx);
      wrap.appendChild(btn);
    });

    // Nav buttons
    document.getElementById('btn-prev').disabled = currentQ === 0;
    document.getElementById('btn-next').textContent = currentQ === 19 ? '查看结果 ✨' : '下一题 →';

    // Fade in
    card.classList.remove('fade-out', 'fade-in');
    void card.offsetWidth; // reflow
    card.style.opacity = '0';
    card.style.transform = direction < 0 ? 'translateX(20px)' : direction > 0 ? 'translateX(-20px)' : 'none';
    requestAnimationFrame(() => {
      card.style.transition = 'opacity .25s, transform .25s';
      card.style.opacity = '1';
      card.style.transform = 'none';
    });
  };

  if (direction !== 0) {
    setTimeout(doRender, 200);
  } else {
    doRender();
  }
}

function selectAnswer(idx) {
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  answers[currentQ] = idx;

  // Update button states
  document.querySelectorAll('.likert-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });

  // Auto-advance
  autoAdvanceTimer = setTimeout(() => {
    if (currentQ < 19) {
      currentQ++;
      renderQuestion(1);
    } else {
      showResult();
    }
  }, 300);
}

function navigate(dir) {
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  if (dir === -1 && currentQ > 0) {
    currentQ--;
    renderQuestion(-1);
  } else if (dir === 1) {
    if (currentQ < 19) {
      currentQ++;
      renderQuestion(1);
    } else {
      showResult();
    }
  }
}

// ─── SCORING ─────────────────────────────────────────────────────────────────

function computeScores() {
  const dims = { RM: [], IE: [], SA: [], VT: [] };

  QUESTIONS.forEach((q, i) => {
    const rawAnswer = answers[i] !== null ? answers[i] : 2; // default: neutral (index 2 = value 3)
    const value = LIKERT[rawAnswer].value; // 5,4,3,2,1
    // Points toward first letter: normal=value, reversed=6-value
    const pts = q.reversed ? (6 - value) : value;
    dims[q.dim].push(pts);
  });

  // Determine dimension letter and normalized score (0-1 toward first letter)
  const result = {};
  for (const [dim, pts] of Object.entries(dims)) {
    const sum = pts.reduce((a, b) => a + b, 0);
    const mid = pts.length * 3;
    const max = pts.length * 5;
    const min = pts.length * 1;
    result[dim] = {
      score: sum,
      normalized: (sum - min) / (max - min), // 0=second letter, 1=first letter
      letter: sum > mid ? 0 : 1 // 0=first letter (R/I/S/V), 1=second (M/E/A/T)
    };
  }
  return result;
}

function findPersonality(dimScores) {
  // User vector: [R,I,S,V] each 0 or 1
  const userVec = [
    dimScores.RM.letter === 0 ? 1 : 0,
    dimScores.IE.letter === 0 ? 1 : 0,
    dimScores.SA.letter === 0 ? 1 : 0,
    dimScores.VT.letter === 0 ? 1 : 0,
  ];

  const distances = PERSONALITIES.map(p => {
    const dist = Math.sqrt(
      p.vector.reduce((sum, v, i) => sum + Math.pow(v - userVec[i], 2), 0)
    );
    return { personality: p, distance: dist };
  });

  distances.sort((a, b) => a.distance - b.distance);
  return distances;
}

// ─── RESULT ──────────────────────────────────────────────────────────────────

function showResult() {
  const dimScores = computeScores();
  const ranked = findPersonality(dimScores);
  const top = ranked[0].personality;
  const secondary = ranked.slice(1, 3).map(r => r.personality);

  document.documentElement.style.setProperty('--personality-color', top.accentColor);

            <div class="dim-bar-bg">
              <div class="dim-bar-fill" style="width:${Math.round(d.pct * 100)}%"></div>
            </div>
          </div>
        `).join('')}

    </div>

    <div>

      <div class="artists-grid">
        ${top.artists.map(a => `
          <div class="artist-card">
            <div class="artist-name">${a.name}</div>
            <div class="artist-songs">
              ${a.songs.map(s => `<div class="artist-song">♪ ${s}</div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:12px">你也可能是…</div>
      <div class="secondary-matches">
        ${secondary.map(p => `
          <div class="secondary-chip">
            <span class="chip-emoji">${p.emoji}</span>
            <div>
              <div class="chip-name">${p.name}</div>
              <div class="chip-tag">${p.tagline.split(' · ')[0]}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="result-actions">
      <button class="btn-share" onclick="copyResult('${top.emoji}', '${top.name}', '${top.tagline}')">📋 分享我的结果</button>
      <button class="btn-restart" onclick="startQuiz()">🔄 重新测试</button>
    </div>
  `;

  showPage('result');
  launchConfetti(top.accentColor);

  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll('.dim-bar-fill').forEach((bar, i) => {
      bar.style.width = Math.round(dimData[i].pct * 100) + '%';
    });
  }, 100);
}

function copyResult(emoji, name, tagline) {
  const text = `我是${emoji}${name}！\n${tagline}\n#音乐16人格测试\n\n快来测测你是哪种音乐人格 🎵`;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────

function launchConfetti(color) {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = [color, '#ffffff', '#c084fc', '#818cf8', '#f9a8d4'];

  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 200,
      vx: (Math.random() - .5) * 4,
      vy: 2 + Math.random() * 4,
      size: 4 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - .5) * .2,
      shape: Math.random() > .5 ? 'rect' : 'circle',
      alpha: 1,
    });
  }

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .08;
      p.rot += p.rotV;
      if (frame > 80) p.alpha -= .015;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';
    }
  }
  draw();
}
