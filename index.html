<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 音乐16人格测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FAEABB;
  --card-bg: rgba(255,255,255,0.25);
  --card-border: rgba(255,255,255,0.45);
  --text: #2a1a00;
  --text-muted: rgba(60,30,0,0.55);
  --accent: #C8641E;
  --personality-color: #C8641E;
}
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', sans-serif; overflow-x: hidden; }

/* Mediterranean dusk bg */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 25% 5%, rgba(255,240,180,.4) 0%, transparent 35%),
    radial-gradient(ellipse at 75% 10%, rgba(244,180,100,.3) 0%, transparent 30%),
    radial-gradient(ellipse at 15% 85%, rgba(45,111,163,.35) 0%, transparent 40%),
    radial-gradient(ellipse at 85% 80%, rgba(37,98,160,.28) 0%, transparent 38%),
    linear-gradient(180deg,
      #FAEABB 0%,
      #F7C46A 12%,
      #F0956A 30%,
      #D9714E 46%,
      #A04E50 60%,
      #5E3F7A 72%,
      #2E6FA8 85%,
      #1E5490 100%
    );
}

/* Confetti canvas */
#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; display: none; }

/* Pages */
.page { min-height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; opacity: 0; transition: opacity .4s ease; position: relative; z-index: 1; }
.page.active { display: flex; }
.page.visible { opacity: 1; }

/* Landing */
#page-landing { text-align: center; gap: 28px; }
.landing-emoji { font-size: 80px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(200,100,30,.45)); }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.landing-title { font-size: clamp(28px,7vw,52px); font-weight: 900; color: #2a1200; text-shadow: 0 1px 8px rgba(255,220,140,.6); line-height: 1.2; }
.landing-sub { font-size: clamp(14px,3.5vw,18px); color: rgba(50,25,0,.65); max-width: 360px; line-height: 1.7; }
.btn-start { padding: 16px 48px; border-radius: 50px; border: 1.5px solid rgba(200,100,30,.4); background: rgba(200,100,30,.75); color: #fff; font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 24px rgba(180,80,20,.3); transition: transform .2s, background .2s, box-shadow .2s; }
.btn-start:hover { transform: scale(1.05); background: rgba(200,100,30,.9); box-shadow: 0 4px 40px rgba(180,80,20,.45); }
.landing-note { font-size: 13px; color: rgba(50,25,0,.45); }

/* Quiz */
#page-quiz { gap: 0; padding: 0; }
.quiz-inner { width: 100%; max-width: 680px; min-height: 100vh; display: flex; flex-direction: column; padding: 32px 16px 24px; gap: 24px; }
.progress-wrap { display: flex; flex-direction: column; gap: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: rgba(50,20,0,.55); }
.progress-bar { height: 4px; background: rgba(200,100,30,.18); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: rgba(200,100,30,.8); border-radius: 4px; transition: width .4s ease; }
.question-card { flex: 1; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.5); border-radius: 24px; padding: 32px 28px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; gap: 28px; transition: opacity .25s, transform .25s; }
.question-num { font-size: 12px; font-weight: 500; letter-spacing: .1em; color: rgba(60,25,0,.5); text-transform: uppercase; }
.question-text { font-size: clamp(16px,4vw,20px); font-weight: 500; line-height: 1.6; color: #2a1200; }
.likert-wrap { display: flex; flex-direction: column; gap: 10px; }
.likert-btn { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: 50px; border: 1.5px solid rgba(200,120,40,.2); background: rgba(255,255,255,.3); color: #2a1200; font-size: 14px; font-family: inherit; cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s, transform .15s; text-align: left; }
.likert-btn:hover { background: rgba(255,255,255,.5); border-color: rgba(200,100,30,.35); transform: translateX(4px); }
.likert-btn.selected { border-color: rgba(200,100,30,.6); background: rgba(255,255,255,.6); box-shadow: 0 0 16px rgba(200,100,30,.2); }
.likert-emoji { font-size: 18px; flex-shrink: 0; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn-nav { padding: 12px 28px; border-radius: 50px; border: 1.5px solid rgba(60,25,0,.2); background: rgba(255,255,255,.2); color: rgba(50,20,0,.7); font-size: 14px; font-family: inherit; cursor: pointer; transition: background .2s, border-color .2s; }
.btn-nav:hover { background: rgba(255,255,255,.38); border-color: rgba(60,25,0,.35); }
.btn-nav:disabled { opacity: .3; cursor: not-allowed; }
.btn-next { padding: 12px 32px; border-radius: 50px; border: none; background: rgba(200,100,30,.8); color: #fff; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: transform .15s, background .15s; box-shadow: 0 3px 16px rgba(180,80,20,.3); }
.btn-next:hover { transform: scale(1.03); background: rgba(200,100,30,.95); }

/* Result */
#page-result { gap: 0; padding: 0; align-items: stretch; }
.result-inner { width: 100%; max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; display: flex; flex-direction: column; gap: 24px; }

.result-hero { text-align: center; padding: 48px 24px 40px; border-radius: 28px; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.5); backdrop-filter: blur(24px); position: relative; overflow: hidden; }
.result-hero::before { content:''; position:absolute; inset:0; background: radial-gradient(ellipse at 50% 0%, var(--personality-color) 0%, transparent 65%); opacity: .18; pointer-events: none; }

/* Mascot */
.mascot-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
.mascot-svg { width: 100px; height: 100px; filter: drop-shadow(0 0 20px var(--personality-color)); }

.result-emoji { font-size: 56px; margin-bottom: 12px; display: block; }
.result-name { font-size: clamp(26px,7vw,40px); font-weight: 900; color: #2a1200; margin-bottom: 10px; }
.result-tagline { font-size: 14px; color: #a05010; font-weight: 500; letter-spacing: .05em; margin-bottom: 20px; border: 1px solid rgba(200,100,30,.3); display: inline-block; padding: 4px 14px; border-radius: 50px; background: rgba(255,220,150,.4); }
.result-desc { font-size: 15px; color: rgba(40,20,0,.7); line-height: 1.8; max-width: 520px; margin: 0 auto; }

/* Dimension bars */
.dims { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dim-bar-wrap { background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.45); border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(10px); }
.dim-labels { display: flex; justify-content: space-between; font-size: 11px; color: rgba(50,20,0,.5); margin-bottom: 6px; }
.dim-bar-bg { height: 6px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; }
.dim-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #C8641E, #4A7FB5); transition: width .8s ease .3s; }

/* Artists */
.section-title { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: rgba(50,20,0,.45); text-transform: uppercase; margin-bottom: 12px; }
.artists-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 12px; }
.artist-card { background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; overflow: hidden; backdrop-filter: blur(10px); transition: transform .2s, border-color .2s, background .2s; }
.artist-card:hover { transform: translateY(-3px); background: rgba(255,255,255,.45); border-color: rgba(200,100,30,.35); }
.artist-cover { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, var(--personality-color) 0%, #0f0f1a 100%); display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; overflow: hidden; }
.artist-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.artist-cover-fallback { position: relative; z-index: 1; }
.artist-info { padding: 12px; }
.artist-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #2a1200; }
.artist-songs { display: flex; flex-direction: column; gap: 2px; }
.artist-song { font-size: 10px; color: rgba(50,20,0,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Music player */
.music-player { background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.45); border-radius: 16px; padding: 16px 20px; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; }
.player-icon { font-size: 32px; flex-shrink: 0; display: inline-block; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.player-info { flex: 1; min-width: 0; }
.player-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-sub { font-size: 11px; color: rgba(50,20,0,.45); }
.player-toggle { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(200,100,30,.8); color: #fff; font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: transform .15s, background .15s; }
.player-toggle:hover { transform: scale(1.1); }
.player-pause-btn { display: inline; border: none; background: none; color: rgba(200,100,30,.9); font-size: 11px; font-family: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
.player-pause-btn:hover { color: rgba(180,60,10,1); }
#netease-iframe { display: none; }

/* Secondary */
.secondary-matches { display: flex; gap: 10px; flex-wrap: wrap; }
.secondary-chip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 50px; border: 1.5px solid rgba(200,100,30,.2); background: rgba(255,255,255,.28); backdrop-filter: blur(10px); font-size: 13px; transition: border-color .2s, background .2s; color: #2a1200; }
.secondary-chip:hover { border-color: rgba(200,100,30,.4); background: rgba(255,255,255,.45); }
.chip-emoji { font-size: 16px; }
.chip-name { font-weight: 600; }
.chip-tag { color: rgba(50,20,0,.45); font-size: 11px; }

/* Actions */
.result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn-share { flex:1; min-width:140px; max-width:220px; padding:14px 24px; border-radius:50px; border:none; background: rgba(200,100,30,.8); color:#fff; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow: 0 4px 20px rgba(180,80,20,.3); transition: transform .15s, background .15s; }
.btn-share:hover { transform: scale(1.04); background: rgba(200,100,30,.95); }
.btn-restart { flex:1; min-width:140px; max-width:220px; padding:14px 24px; border-radius:50px; border:1.5px solid rgba(60,25,0,.2); background:rgba(255,255,255,.2); color:rgba(40,20,0,.7); font-size:14px; font-family:inherit; cursor:pointer; transition: background .2s; }
.btn-restart:hover { background: rgba(255,255,255,.38); }

/* Toast */
.copy-toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(200,100,30,.9); backdrop-filter:blur(16px); border:1px solid rgba(255,220,150,.3); color:#fff; padding:12px 24px; border-radius:50px; font-size:14px; transition:transform .3s ease; z-index:1000; white-space:nowrap; }
.copy-toast.show { transform:translateX(-50%) translateY(0); }

/* Share card modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:500; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.active { display:flex; }
.share-modal { background:rgba(255,245,220,.92); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.6); border-radius:24px; padding:24px; max-width:400px; width:100%; display:flex; flex-direction:column; gap:16px; }
.share-card { border-radius:16px; overflow:hidden; background: linear-gradient(135deg, #FAEABB 0%, #F0956A 50%, #4A7FB5 100%); padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
.share-card::before { content:''; position:absolute; inset:0; background: radial-gradient(ellipse at 50% 0%, var(--personality-color) 0%, transparent 60%); opacity:.2; }
.share-card-content { position: relative; z-index:1; }
.share-card-emoji { font-size: 48px; display:block; margin-bottom:8px; }
.share-card-name { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 4px; }
.share-card-tag { font-size: 12px; color: rgba(255,255,255,.6); margin-bottom: 12px; }
.share-card-desc { font-size: 12px; color: rgba(255,255,255,.75); line-height: 1.6; margin-bottom: 16px; }
.share-card-url { font-size: 11px; color: rgba(255,255,255,.4); }
.share-card-qr { position: absolute; right: 20px; bottom: 20px; z-index:1; background:#fff; padding:4px; border-radius:8px; }
.share-modal-btns { display: flex; gap: 10px; }
.btn-download { flex:1; padding:12px; border-radius:50px; border:none; background:rgba(200,100,30,.85); color:#fff; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
.btn-close-modal { flex:1; padding:12px; border-radius:50px; border:1.5px solid rgba(60,25,0,.2); background:transparent; color:rgba(50,20,0,.65); font-size:13px; font-family:inherit; cursor:pointer; }

@media (max-width:480px) {
  .dims { grid-template-columns: 1fr; }
  .artists-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="stars"></div>
<canvas id="confetti-canvas"></canvas>
<div id="toast" class="copy-toast">✅ 已复制到剪贴板！</div>

<!-- Share Modal -->
<div class="modal-overlay" id="share-modal">
  <div class="share-modal">
    <div style="font-size:15px;font-weight:700;">分享你的音乐人格 🎵</div>
    <div class="share-card" id="share-card">
      <div class="share-card-content">
        <span class="share-card-emoji" id="sc-emoji"></span>
        <div class="share-card-name" id="sc-name"></div>
        <div class="share-card-tag" id="sc-tag"></div>
        <div class="share-card-desc" id="sc-desc"></div>
        <div class="share-card-url">sameenshaw-1.github.io/music16</div>
      </div>
      <div class="share-card-qr" id="qr-container"></div>
    </div>
    <div class="share-modal-btns">
      <button class="btn-download" onclick="downloadShareCard()">⬇ 保存图片</button>
      <button class="btn-close-modal" onclick="closeShareModal()">关闭</button>
    </div>
  </div>
</div>

<!-- LANDING -->
<div id="page-landing" class="page">
  <div class="landing-emoji">🎵</div>
  <h1 class="landing-title">音乐16人格测试</h1>
  <p class="landing-sub">20道题，发现你的音乐灵魂<br>你是哪一种听音乐的人？</p>
  <button class="btn-start" onclick="startQuiz()">开始测试</button>
  <p class="landing-note">约需3分钟 · 共20道题</p>
</div>

<!-- QUIZ -->
<div id="page-quiz" class="page">
  <div class="quiz-inner">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="q-label">第 1 题</span>
        <span>共 20 题</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>
    </div>
    <div class="question-card" id="question-card">
      <div class="question-num" id="q-num">Q1</div>
      <div class="question-text" id="q-text"></div>
      <div class="likert-wrap" id="likert-wrap"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">← 上一题</button>
      <button class="btn-next" id="btn-next" onclick="navigate(1)">下一题 →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="page-result" class="page">
  <div class="result-inner" id="result-inner"></div>
</div>

<!-- Netease iframe (hidden) -->
<iframe id="netease-iframe" frameborder="no" border="0" marginwidth="0" marginheight="0" width="0" height="0" allow="autoplay"></iframe>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const QUESTIONS = [
  { text: "听到一首新歌，我会先被鼓点/节拍抓住，而不是旋律。", dim: "RM", reversed: false },
  { text: "我喜欢一边听音乐一边仔细读歌词，歌词对我来说很重要。", dim: "VT", reversed: false },
  { text: "我经常在睡前或发呆时听音乐，把它当成进入内心的钥匙。", dim: "IE", reversed: false },
  { text: "没有人声、纯器乐的曲子也能让我完全沉进去。", dim: "VT", reversed: true },
  { text: "我喜欢有电子合成感、制作精良的现代音乐，而不是原声录音感。", dim: "SA", reversed: false },
  { text: "听音乐时，我会忍不住跟着节奏点头、踏脚或摇摆。", dim: "RM", reversed: false },
  { text: "我更偏向把音乐分享给朋友，而不是一个人偷偷收藏。", dim: "IE", reversed: true },
  { text: "我会花时间深挖一个歌手的全部专辑，而不是随机发现新歌。", dim: "IE", reversed: false },
  { text: "听到吉他、钢琴等真实乐器的声音，我会感觉更温暖、更踏实。", dim: "SA", reversed: true },
  { text: "音乐对我来说更像是「出口」——它帮我释放，而不是沉淀。", dim: "IE", reversed: true },
  { text: "我觉得旋律比节奏更能触动我的情绪。", dim: "RM", reversed: true },
  { text: "我喜欢那种「歌词说出了我想说却没说出口的话」的感觉。", dim: "VT", reversed: false },
  { text: "我喜欢把音乐当成背景氛围，而不是专注聆听的对象。", dim: "VT", reversed: true },
  { text: "我觉得现场演出的「能量和互动」比「技术和还原度」更重要。", dim: "IE", reversed: true },
  { text: "我会被沙哑、有质感、不完美的嗓音打动，胜过精准完美的高音。", dim: "SA", reversed: true },
  { text: "我喜欢跟上潮流、听大家都在聊的热门音乐。", dim: "IE", reversed: true },
  { text: "一首歌如果没有歌词，我觉得它缺少了「灵魂」。", dim: "VT", reversed: false },
  { text: "我愿意听完全陌生风格的音乐，觉得探索本身就有趣。", dim: "SA", reversed: false },
  { text: "某些音乐会让我想起一段记忆或某个人，这比感官刺激更重要。", dim: "IE", reversed: false },
  { text: "节奏快、有爆发力的音乐让我感觉更有活力，我比较偏好这类。", dim: "RM", reversed: false },
];

const LIKERT = [
  { label: "非常符合", emoji: "😄", value: 5 },
  { label: "比较符合", emoji: "🙂", value: 4 },
  { label: "说不准",   emoji: "😐", value: 3 },
  { label: "不太符合", emoji: "😕", value: 2 },
  { label: "完全不符合",emoji: "😞", value: 1 },
];

// Mascot SVGs — unique cartoon character per personality
function getMascotSVG(id, color) {
  const c = color;
  const masks = [
    // 1 霓虹造梦机 — pop star with mic
    `<svg viewBox="0 0 100 100" class="mascot-svg"><circle cx="50" cy="35" r="20" fill="${c}" opacity=".9"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="${c}" opacity=".7"/><circle cx="43" cy="31" r="3" fill="#fff"/><circle cx="57" cy="31" r="3" fill="#fff"/><path d="M43 42 Q50 48 57 42" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="56" y="44" width="3" height="12" rx="1.5" fill="#fff" opacity=".8"/><circle cx="57.5" cy="57" r="3" fill="#fff" opacity=".8"/><polygon points="20,20 28,10 24,22" fill="${c}" opacity=".6"/><polygon points="80,20 72,10 76,22" fill="${c}" opacity=".6"/></svg>`,
    // 2 派对变色龙 — DJ with headphones

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentQ = 0;
let answers = new Array(20).fill(null);
let autoAdvanceTimer = null;
let musicPlaying = false;
let currentPersonality = null;

// ─── PAGE TRANSITIONS ────────────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => { p.classList.remove('active','visible'); });
  const page = document.getElementById('page-'+id);
  page.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('visible')));
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
function startQuiz() {
  currentQ = 0; answers = new Array(20).fill(null);
  stopMusic();
  renderQuestion(); showPage('quiz');
}

function renderQuestion(direction = 0) {
  const card = document.getElementById('question-card');
  const q = QUESTIONS[currentQ];
  const doRender = () => {
    document.getElementById('q-label').textContent = `第 ${currentQ+1} 题`;
    document.getElementById('q-num').textContent = `Q${currentQ+1}`;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('progress-fill').style.width = `${((currentQ+1)/20)*100}%`;
    const wrap = document.getElementById('likert-wrap');
    wrap.innerHTML = '';
    LIKERT.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'likert-btn' + (answers[currentQ] === idx ? ' selected' : '');
      btn.innerHTML = `<span class="likert-emoji">${opt.emoji}</span><span>${opt.label}</span>`;
      btn.onclick = () => selectAnswer(idx);
      wrap.appendChild(btn);
    });
    document.getElementById('btn-prev').disabled = currentQ === 0;
    document.getElementById('btn-next').textContent = currentQ === 19 ? '查看结果 ✨' : '下一题 →';
    card.style.transition = 'opacity .25s, transform .25s';
    card.style.opacity = '0';
    card.style.transform = direction < 0 ? 'translateX(20px)' : direction > 0 ? 'translateX(-20px)' : 'none';
    requestAnimationFrame(() => { card.style.opacity='1'; card.style.transform='none'; });
  };
  direction !== 0 ? setTimeout(doRender, 200) : doRender();
}

function selectAnswer(idx) {
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  answers[currentQ] = idx;
  document.querySelectorAll('.likert-btn').forEach((btn, i) => btn.classList.toggle('selected', i === idx));
  autoAdvanceTimer = setTimeout(() => {
    if (currentQ < 19) { currentQ++; renderQuestion(1); }
    else showResult();
  }, 300);
}

function navigate(dir) {
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  if (dir === -1 && currentQ > 0) { currentQ--; renderQuestion(-1); }
  else if (dir === 1) { if (currentQ < 19) { currentQ++; renderQuestion(1); } else showResult(); }
}

// ─── SCORING ─────────────────────────────────────────────────────────────────
function computeScores() {
  const dims = { RM:[], IE:[], SA:[], VT:[] };
  QUESTIONS.forEach((q, i) => {
    const rawAnswer = answers[i] !== null ? answers[i] : 2;
    const value = LIKERT[rawAnswer].value;
    const pts = q.reversed ? (6-value) : value;
    dims[q.dim].push(pts);
  });
  const result = {};
  for (const [dim, pts] of Object.entries(dims)) {
    const sum = pts.reduce((a,b) => a+b, 0);
    const mid = pts.length * 3;
    const max = pts.length * 5; const min = pts.length * 1;
    result[dim] = { score: sum, normalized: (sum-min)/(max-min), letter: sum > mid ? 0 : 1 };
  }
  return result;
}

function findPersonality(dimScores) {
  const userVec = [
    dimScores.RM.letter === 0 ? 1 : 0,
    dimScores.IE.letter === 0 ? 1 : 0,
    dimScores.SA.letter === 0 ? 1 : 0,
    dimScores.VT.letter === 0 ? 1 : 0,
  ];
  return PERSONALITIES.map(p => ({
    personality: p,
    distance: Math.sqrt(p.vector.reduce((sum,v,i) => sum+Math.pow(v-userVec[i],2), 0))
  })).sort((a,b) => a.distance - b.distance);
}

// ─── RESULT ──────────────────────────────────────────────────────────────────
function showResult() {

      bar.style.width = bar.dataset.pct + '%';
    });

  });

// ─── ARTIST ART (iTunes Search API) ─────────────────────────────────────────
async function fetchAlbumArt(artistName, idx) {
  try {
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(artistName)}&entity=musicArtist&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    const artist = data?.results?.[0];
    if (artist?.artworkUrl100) {
      // Get larger version: replace 100x100 with 400x400
      const imgUrl = artist.artworkUrl100.replace('100x100', '400x400');
      const covers = document.querySelectorAll('.artist-cover');
      if (covers[idx]) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.onerror = () => {}; // keep emoji fallback
        covers[idx].prepend(img);
      }
    }
  } catch(e) { /* silent fail */ }
}

// ─── MUSIC PLAYER ────────────────────────────────────────────────────────────
function toggleMusic() {
  if (!currentPersonality) return;
  if (musicPlaying) { stopMusic(); } else { playMusic(); }
}

function playMusic() {
  const iframe = document.getElementById('netease-iframe');
  const id = currentPersonality.neteaseId;
  iframe.src = `https://music.163.com/outchain/player?type=2&id=${id}&auto=1&height=66`;
  iframe.style.display = 'block';
  iframe.width = '0'; iframe.height = '0';
  musicPlaying = true;
  const btn = document.getElementById('player-toggle');
  if (btn) btn.textContent = '暂停';
  const icon = document.getElementById('player-icon');
  if (icon) icon.style.animation = 'spin 2s linear infinite';
}

function stopMusic() {
  const iframe = document.getElementById('netease-iframe');
  iframe.src = ''; iframe.style.display = 'none';
  musicPlaying = false;
  const btn = document.getElementById('player-toggle');
  if (btn) btn.textContent = '播放';
  const icon = document.getElementById('player-icon');
  if (icon) icon.style.animation = '';
}

// ─── SHARE MODAL ─────────────────────────────────────────────────────────────
let qrGenerated = false;

function openShareModal() {
  const p = currentPersonality;
  if (!p) return;
  document.getElementById('sc-emoji').textContent = p.emoji;
  document.getElementById('sc-name').textContent = p.name;
  document.getElementById('sc-tag').textContent = p.tagline;

  const qrContainer = document.getElementById('qr-container');

    qrContainer.innerHTML = '';
    new QRCode(qrContainer, {
      text: 'https://sameenshaw-1.github.io/music16/',

}

function closeShareModal() {
  document.getElementById('share-modal').classList.remove('active');
}

function downloadShareCard() {
  const card = document.getElementById('share-card');
  html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
    const link = document.createElement('a');
    link.download = `音乐人格-${currentPersonality.name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────
function launchConfetti(color) {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = [];
  const colors = [color,'#ffffff','#c084fc','#818cf8','#f9a8d4'];
  for (let i = 0; i < 120; i++) {
    particles.push({ x:Math.random()*canvas.width, y:-10-Math.random()*200, vx:(Math.random()-.5)*4, vy:2+Math.random()*4, size:4+Math.random()*7, color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.2, shape:Math.random()>.5?'rect':'circle', alpha:1 });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.rot+=p.rotV;
      if (frame > 80) p.alpha -= .015;
      ctx.save(); ctx.globalAlpha = Math.max(0,p.alpha); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}
